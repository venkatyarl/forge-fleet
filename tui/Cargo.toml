[package]
name = "ff-tui"
version = "2026.7.28"
edition = "2024"
description = "ForgeFleet terminal UI — kimi-style agent TUI attachable to any LLM (local endpoint, cloud CLI, or the fleet LLM router)"

[[bin]]
name = "fftui"
path = "src/main.rs"

[dependencies]
ff-agent = { path = "../crates/ff-agent" }
ff-core = { path = "../crates/ff-core" }

anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.29"
